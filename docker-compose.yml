version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-ecommerce-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 140923
      POSTGRES_DB: mini_ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
